<VirtualHost *:80>
    ServerName miniframework
    DocumentRoot /var/www/miniframework/public

    <Directory /var/www/miniframework/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog /var/www/miniframework/error.log
    CustomLog /var/www/miniframework/access.log combined
</VirtualHost>
