services:
  http:
    container_name: httpd.miniframework
    build:
      context: ./Docker
      dockerfile: httpd.Dockerfile
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - C:/Users/Carlos/Desktop/projeto/miniframework/:/var/www/miniframework
    networks:
      - private_network

  postgres:
    container_name: postgres
    build:
      context: ./Docker
      dockerfile: postgres.Dockerfile
    ports:
      - '5432:5432'
    networks:
      - private_network

networks:
  private_network:
    driver: bridge
