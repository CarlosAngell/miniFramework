services:
  http:
    container_name: httpd.miniframework
    build:
      context: ./docker
      dockerfile: httpd.Dockerfile
    ports:
      - '80:80'
      - '443:443'
    volumes:
    # O ./ representa o diretório atual do projeto, relativo à localização do arquivo Compose.
      - ./:/var/www/miniframework
    networks:
      - private_network

  postgres:
    container_name: postgres
    build:
      context: ./docker
      dockerfile: postgres.Dockerfile
    ports:
      - '5432:5432'
    networks:
      - private_network

networks:
  private_network:
    driver: bridge
